name: Update manifest.json

on:
  push:
    branches:
      - main

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow pushing back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important: fetch full git history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate manifest.json
        run: |
            import os
            import json
            import subprocess
            from datetime import datetime
            from collections import defaultdict

            # --- STEP 1: FAST global history scan ---
            result = subprocess.run(
                ["git", "log", "--name-only", "--format=%H|%ci"],
                capture_output=True,
                text=True
            )

            lines = result.stdout.splitlines()

            file_history = defaultdict(list)
            current_date = None

            for line in lines:
                if "|" in line:
                    _, current_date = line.split("|", 1)
                elif line.strip() == "":
                    continue
                else:
                    path = line.strip()
                    file_history[path].append(current_date)

            # --- STEP 2: helper for accurate fallback ---
            def get_follow_history(path):
                try:
                    r = subprocess.run(
                        ["git", "log", "--follow", "--format=%ci", "--", path],
                        capture_output=True,
                        text=True
                    )
                    dates = [d for d in r.stdout.strip().split("\n") if d]
                    return dates
                except:
                    return []

            # --- STEP 3: build manifest ---
            posts = []
            svgs = []

            def to_dt(d):
                return datetime.strptime(d, "%Y-%m-%d %H:%M:%S %z") if d else datetime.min

            for root, dirs, files in os.walk("."):
                for f in files:
                    if f.startswith("__"):
                        continue

                    path = os.path.relpath(os.path.join(root, f), ".").replace("\\", "/")

                    history = file_history.get(path, [])

                    # --- HYBRID FIX ---
                    if len(history) <= 1:
                        follow_history = get_follow_history(path)
                        if follow_history:
                            history = follow_history

                    if history:
                        last_modified_date = history[0]   # latest
                        created_date = history[-1]        # oldest
                    else:
                        created_date = None
                        last_modified_date = None

                    if f.endswith(".md") and f not in ["README.md", "index.md", "manifest.json", "prompt.md"]:
                        title = os.path.splitext(f)[0]
                        parent_folder = os.path.basename(root)

                        if title != parent_folder:
                            continue

                        posts.append({
                            "title": title,
                            "path": path,
                            "created_date": created_date,
                            "last_modified_date": last_modified_date,
                            "_dt": to_dt(created_date)
                        })

                    elif f.endswith(".svg"):
                        svgs.append({
                            "name": os.path.splitext(f)[0],
                            "path": path,
                            "created_date": created_date,
                            "last_modified_date": last_modified_date,
                            "_dt": to_dt(created_date)
                        })

            # --- STEP 4: sort ---
            posts.sort(key=lambda x: x["_dt"], reverse=True)
            svgs.sort(key=lambda x: x["_dt"], reverse=True)

            # cleanup
            for item in posts + svgs:
                item.pop("_dt", None)

            # --- STEP 5: write ---
            with open("manifest.json", "w") as f:
                json.dump({"posts": posts, "svgs": svgs}, f, indent=2)
        shell: python

      - name: Commit and push manifest.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update manifest.json" || echo "No changes to commit"
          git push

      # The site reads this repo through jsDelivr, which caches @main for ~12h.
      # Without a purge a new post stays invisible until that expires.
      # Best-effort: a failed purge must never fail publishing.
      - name: Purge jsDelivr cache
        if: always()
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
            import json
            import os
            import subprocess
            import urllib.error
            import urllib.parse
            import urllib.request

            REPO = "/gh/jebin2/blog@main/"
            SERVED = (".md", ".json", ".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg")

            # Always purge the files the site fetches on every visit; they gate
            # everything else, so a stale manifest hides new posts entirely.
            paths = ["manifest.json", "data/projects.json", "data/links.json"]

            before, after = os.environ.get("BEFORE", ""), os.environ.get("AFTER", "")
            if before and after and set(before) != {"0"}:
                try:
                    out = subprocess.run(
                        ["git", "diff", "--name-only", before, after],
                        capture_output=True, text=True, check=True,
                    ).stdout
                    paths += [p for p in out.splitlines() if p.endswith(SERVED)]
                except subprocess.CalledProcessError as e:
                    print("could not diff push range, purging defaults only:", e)

            # De-duplicate, preserving order
            seen, urls = set(), []
            for p in paths:
                if p in seen:
                    continue
                seen.add(p)
                urls.append(REPO + "/".join(urllib.parse.quote(s) for s in p.split("/")))

            print(f"purging {len(urls)} path(s)")

            # jsDelivr throttles large purges; send in small batches
            for i in range(0, len(urls), 20):
                batch = urls[i:i + 20]
                req = urllib.request.Request(
                    "https://purge.jsdelivr.net/",
                    data=json.dumps({"path": batch}).encode(),
                    headers={"Content-Type": "application/json"},
                )
                try:
                    with urllib.request.urlopen(req, timeout=60) as res:
                        body = json.load(res)
                    print(f"  batch {i // 20 + 1}: {body.get('status')} (id {body.get('id')})")
                except (urllib.error.URLError, TimeoutError, ValueError) as e:
                    print(f"  batch {i // 20 + 1}: purge failed — {e}")

            for u in urls:
                print("  ", u)
        shell: python
