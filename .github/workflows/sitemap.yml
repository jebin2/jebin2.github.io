name: Build site

# Content lives in this repo now, so a push is the only thing that can change
# the built output. No cron, no cross-repo trigger.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'config.json'
      - 'js/utils.js'          # slug rule — changing it moves every post URL
      - 'scripts/**'
      - '.github/workflows/sitemap.yml'

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: post dates come from each file's commits
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pinned to the same version the browser loads, so build-time and
      # client-side rendering of the same markdown agree.
      - run: npm install --no-save marked@9.1.6

      - name: Index posts
        run: node scripts/generate-manifest.mjs

      - name: Prerender posts
        run: node scripts/prerender.mjs

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain content/manifest.json writing/ sitemap.xml)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/manifest.json writing/ sitemap.xml
          git commit -m "chore: rebuild manifest, post pages and sitemap"
          git push
