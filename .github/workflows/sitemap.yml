name: Build site

# Posts live in the blog repo, so prerendered pages and the sitemap go stale
# without anything changing here. Rebuild daily, on demand, and whenever the
# build inputs change.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config.json'
      - 'js/utils.js'          # slug rule — changing it moves every post URL
      - 'scripts/**'
      - '.github/workflows/sitemap.yml'

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so lastmod can come from each page's last commit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pinned to the same version the browser loads, so build-time and
      # client-side rendering of the same markdown agree.
      - run: npm install --no-save marked@9.1.6

      - name: Prerender posts
        run: node scripts/prerender.mjs

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- sitemap.xml writing/ && [ -z "$(git status --porcelain writing/)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sitemap.xml writing/
          git commit -m "chore: rebuild prerendered posts and sitemap"
          git push
